name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端测试与打包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven 验证
        run: mvn -B -ntp verify

  frontend:
    name: 前端校验与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build
